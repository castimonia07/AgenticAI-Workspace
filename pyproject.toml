[project]
name = "agenticaiworkspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "castimonia07", email = "rpandey126.jpsv@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.14",
    "langgraph-cli[inmem]>=0.4.33",
    "langsmith>=0.14.5",
    "mcp>=1.30.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agenticaiworkspace = "agenticaiworkspace:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
